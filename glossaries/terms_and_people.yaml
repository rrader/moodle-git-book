- id: 54
  concept: Computer Vision
  aliases:
  - Комп'ютерний зір
  - CV
  - комп'ютерного зору
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p dir="ltr" style="text-align: left;"><strong>Computer Vision (Комп''ютерний
    зір / CV)</strong> — галузь штучного інтелекту, яка навчає комп''ютери та системи
    витягувати значущу інформацію з цифрових зображень, відеопотоків та інших візуальних
    даних. Замість простого зберігання пікселів, CV дозволяє системам розпізнавати
    об''єкти, відстежувати рухи (наприклад, hand-tracking жести для керування дронами),
    класифікувати структури (як у біологічній чи медичній діагностиці) та орієнтуватися
    у просторі автономному транспорту.</p>'
