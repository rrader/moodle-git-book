  definition: <p><b>МАН (Мала академія наук України)</b> — загальнодержавна науково-освітня
    система учнівської молоді в Україні. Щорічний Всеукраїнський конкурс-захист науково-дослідницьких
    робіт учнів-членів МАН є головним академічним змаганням для старшокласників. Дослідження
    у сфері комп'ютерних наук та ШІ захищаються у відділеннях комп'ютерних наук (секції
    штучного інтелекту, програмної інженерії, кібербезпеки, комп'ютерних систем та
    мереж). Перемога на всеукраїнському етапі дає академічні переваги при вступі до
    ЗВО та президентські стипендії.</p>
