  - перцептрон
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: <p><b>Персептрон (Perceptron)</b> — математична та програмна модель
    простого штучного нейрона, запропонована Френком Розенблаттом у 1957 році. Персептрон
    приймає на вхід числові значення (сигнали), множить кожне з них на відповідну
    вагу (ваговий коефіцієнт), додає зміщення (bias) і пропускає суму крізь функцію
    активації для отримання кінцевого вихідного сигналу (0 або 1). Є фундаментальним
    будівельним блоком багатошарових нейронних мереж.</p>
