- id: 67
  concept: EDA
  aliases:
  - Exploratory Data Analysis
  - розвідувальний аналіз даних
  - розвідувальний аналіз
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: <p><b>EDA (Exploratory Data Analysis / Розвідувальний аналіз даних)</b>
    — початковий етап роботи Data Scientist над датасетом, мета якого — дослідити
    структуру даних, розподіл ознак, виявити аномалії, пропущені значення, кореляції
    та візуалізувати закономірності за допомогою графіків (гістограми, теплові карти,
    boxplot) перед вибором та тренуванням моделі ML.</p>
- id: 24
  concept: GPT
  aliases:
  - ChatGPT
  - GPT-3
  - GPT-4
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p dir="ltr" style="text-align: left;">GPT - Generative Pretraining
    of Transformers,&nbsp;сімейство мовних моделей, які зазвичай навчаються на великому
    корпусі текстових даних для створення тексту, схожого на текст людини.<br></p><p
    dir="ltr" style="text-align: left;">ChatGPT - сервіс, що надає доступ до GPT у
    вигляді чат-боту.</p>'
- id: 74
  concept: ISEF
  aliases:
  - ISEF Україна
  - Regeneron ISEF
  - International Science and Engineering Fair
  - ІСЕФ
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: <p><b>ISEF (Regeneron International Science and Engineering Fair)</b>
    — найпрестижніший у світі міжнародний конкурс науково-технічної творчості для
    учнів середніх шкіл. Щорічно об'єднує понад 1800 юних науковців та інженерів із
    більш ніж 75 країн. В Україні проводиться національний етап відбору (<b>ISEF Україна</b>),
    переможці якого представляють державу у світовому фіналі в США. Оцінюються глибина
    наукового дослідження, інженерна архітектура, наукова новизна та практичне значення
    результатів.</p>
- id: 36
  concept: KNeighborsClassifier
  aliases: []
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: <p>Один із найпростіших і інтуїтивно зрозумілих класифікаторів, що базується
    на алгоритмі K-Nearest Neighbors (KNN). Він класифікує нові об'єкти на основі
    близькості до вже класифікованих прикладів у просторі ознак. Ідея методу полягає
    в тому, що новий об'єкт отримує той клас, до якого належать найближчі до нього
    сусіди. Кількість сусідів (K) визначається користувачем — це ключовий параметр
    моделі. Для обчислення "відстані" між об'єктами зазвичай використовують Евклідову
    відстань, хоча можливі й інші метрики. Перевага KNN — це простота, але він може
    бути менш ефективним на великих наборах даних або коли потрібно враховувати складні
    зв'язки між ознаками.</p>
- id: 64
  concept: LLM
  aliases:
  - Large Language Model
  - велика мовна модель
  - великі мовні моделі
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p><b>LLM (Large Language Model / Велика мовна модель)</b> — модель
    глибокого навчання (зазвичай на базі архітектури Transformer), що містить мільярди
    або трильйони параметрів і навчена на колосальних обсягах тексту. LLM здатні розуміти,
    узагальнювати, перекладати та генерувати людиноподібний текст, писати програмний
    код та вирішувати логічні задачі. Приклади: GPT-4, Llama, Gemini, Claude.</p>'
- id: 53
  concept: NLP
  aliases:
  - Обробка природної мови
  - Natural Language Processing
  - обробки природної мови
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p dir="ltr" style="text-align: left;"><strong>NLP (Natural Language
    Processing / Обробка природної мови)</strong> — підгалузь штучного інтелекту,
    комп''ютерної лінгвістики та машинного навчання, спрямована на забезпечення здатності
    комп''ютерів розуміти, інтерпретувати, генерувати та маніпулювати людською мовою
    (як текстом, так і голосом). Застосовується в чат-ботах, машинному перекладі,
    аналізі тональності (sentiment analysis), автодоповненні коду та великих мовних
    моделях (LLM).</p>'
- id: 70
  concept: NumPy
  aliases:
  - numpy
  - np.array
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: <p><b>NumPy (Numerical Python)</b> — фундаментальна бібліотека мови
    Python для наукових і математичних обчислень. Вона забезпечує підтримку високопродуктивних
    багатовимірних масивів та матриць (<code>ndarray</code>), а також величезну колекцію
    оптимізованих математичних функцій лінійної алгебри, перетворень Фур'є та генерації
    випадкових чисел.</p>
- id: 25
  concept: OpenAI
  aliases: []
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p dir="ltr" style="text-align: left;">лабораторія досліджень штучного
    інтелекту, що розробила GPT, Whisper, Sora та інші передові моделі<br></p>'
- id: 60
  concept: OpenCV
  aliases:
  - cv2
  - Open Source Computer Vision Library
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: <p><b>OpenCV (Open Source Computer Vision Library)</b> — провідна бібліотека
    з відкритим кодом для комп'ютерного зору, аналізу та обробки зображень і відео
    в реальному часі. У Python підключається модулем <code>cv2</code>. Містить тисячі
    оптимізованих алгоритмів для розпізнавання облич, фільтрації шумів, детекції країв,
    пошуку контурів, калібрування камер тощо.</p>
- id: 38
  concept: Pandas
  aliases: []
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p dir="ltr" style="text-align: left;">Одна з найпопулярніших бібліотек
    Python для аналізу даних, яка надає зручні інструменти для роботи з табличними
    даними. Вона дозволяє ефективно обробляти, аналізувати та візуалізувати великі
    масиви даних.</p>'
- id: 22
  concept: prompt engineering
  aliases:
  - інженерія запитів
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p dir="ltr" style="text-align: left;">це процес формулювання запиту
    для генеративного штучного інтелекту, наприклад для ChatGPT<br></p>'
- id: 63
  concept: RAG
  aliases:
  - Retrieval-Augmented Generation
  - доповнена генерація
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: <p><b>RAG (Retrieval-Augmented Generation / Генерація з доповненим пошуком)</b>
    — архітектурний підхід для великих мовних моделей (LLM), за якого перед генерацією
    відповіді система спочатку здійснює пошук актуальних та достовірних фрагментів
    інформації у зовнішній базі знань (векторній базі даних чи документах компанії),
    а потім додає їх у контекст запиту до LLM. Це суттєво зменшує галюцинації та дозволяє
    моделі оперувати приватними даними без додаткового донавчання (fine-tuning).</p>
- id: 62
  concept: RGB та BGR
  aliases:
  - RGB
  - BGR
  - колірний простір
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p><b>RGB (Red, Green, Blue)</b> — стандартна колірна модель цифрових
    зображень, у якій будь-який відтінок утворюється поєднанням трьох базових каналів:
    червоного, зеленого та синього. <b>BGR</b> — порядок колірних каналів, який історично
    використовується за замовчуванням у бібліотеці <b>OpenCV</b> (синій, зелений,
    червоний). При читанні зображення в OpenCV для коректного відображення в Matplotlib
    його зазвичай конвертують через <code>cv2.cvtColor(img, cv2.COLOR_BGR2RGB)</code>.</p>'
- id: 32
  concept: sentiment analysis
  aliases:
  - аналіз настрою
  - аналіз тональності тексту
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p dir="ltr" style="text-align: left;">Метод аналізу природної мови
    в комп''ютерній лінгвістиці, призначений для виявлення в текстах емоційної забарвленості.
    Наприклад, визначення, чи є відгук до фільму позитивним чи негативним.</p>'
- id: 75
  concept: Teens in AI
  aliases:
  - Teens in AI Hackathon
  - Global Techathon
  - Тінс ін АІ
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p><b>Teens in AI</b> — глобальна міжнародна освітня ініціатива, заснована
    під егідою Саміту AI for Good (ООН/ITU). Організовує всесвітні технологічні хакатони
    (зокрема щорічний <i>Global Techathon</i> до Цілей сталого розвитку ООН SDG) для
    молоді віком 12–18 років. Учасники проходять повний цикл продуктової інженерії:
    від дизайн-мислення (Design Thinking) та побудови Lean Canvas до програмування
    AI-прототипу й захисту англійською мовою перед міжнародним журі.</p>'
- id: 33
  concept: time-series
  aliases: []
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p dir="ltr" style="text-align: left;">Послідовність даних, зібраних
    або записаних у хронологічному порядку через рівні проміжки часу. Аналіз часових
    рядів дозволяє досліджувати закономірності, тренди та сезонність у даних для прогнозування
    майбутніх значень.</p>'
- id: 68
  concept: Train/Test Split
  aliases:
  - навчальна вибірка
  - тестова вибірка
  - train test split
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p><b>Train/Test Split (Розділення на навчальну та тестову вибірки)</b>
    — фундаментальний метод оцінки моделей машинного навчання. Датасет ділять на дві
    неперетинні частини: <i>навчальну (train)</i> (зазвичай 70–80%), на якій модель
    вчиться шукати закономірності, і <i>тестову (test)</i> (20–30%), на якій перевіряють
    якість роботи моделі на нових для неї даних для перевірки здатності до узагальнення
    та виявлення перенавчання.</p>'
- id: 76
  concept: WAICY
  aliases:
  - World Artificial Intelligence Competition for Youth
  - ВАІСІ
  - конкурс WAICY
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: <p><b>WAICY (World Artificial Intelligence Competition for Youth)</b>
    — провідне світове змагання зі штучного інтелекту для дітей та підлітків, організоване
    за підтримки американських університетів (зокрема Carnegie Mellon University)
    та провідних AI-лабораторій. Проводиться у форматах AI Showcase (демонстрація
    власних розробок, веб-застосунків та моделей) та AI Track. Учні презентують власні
    технологічні проєкти, спрямовані на вирішення реальних суспільних, медичних та
    екологічних проблем.</p>
- id: 26
  concept: Whisper
  aliases: []
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p dir="ltr" style="text-align: left;">модель машинного навчання для
    розпізнавання голосу, створена OpenAI</p>'
- id: 29
  concept: Алан Тюрінг
  aliases:
  - Тюрінг
  - Тест Тюрінга
  - Turing
  usedynalink: 1
  casesensitive: 0
  fullmatch: 0
  definition: '<p dir="ltr" style="text-align: left;">Британський науковець. Математик,
    криптограф, логік. Брав участь у розшифровуванні повідомлень, закодованих німецькою
    шифрувальною машиною «Енігма».<span style="font-size: 0.9375rem; font-family:
    -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica
    Neue&quot;, Arial, &quot;Noto Sans&quot;, &quot;Liberation Sans&quot;, sans-serif,
    &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;,
    &quot;Noto Color Emoji&quot;;">&nbsp;Він запропонував концепцію машини Тюрінга,
    яка стала основою сучасної інформатики.</span></p><p dir="ltr" style="text-align:
    left;">Тест Тюрінга&nbsp;— тест для перевірки, чи є комп''ютер розумним у людському
    сенсі слова.<br></p>'
- id: 66
  concept: Галюцинація ШІ
  aliases:
  - галюцинація
  - галюцинації
  - AI Hallucination
  - галлюцинація
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: <p><b>Галюцинація ШІ (AI Hallucination)</b> — явище, коли генеративна
    модель або LLM продукує фактично неправдиву, вигадану або беззмістовну інформацію,
    але подає її надзвичайно впевненим, переконливим та граматично правильним тоном.
    Виникає через те, що LLM прогнозує найбільш імовірні наступні токени на основі
    статистичних патернів, а не володіє справжнім розумінням фактів.</p>
- id: 56
  concept: Глибоке навчання
  aliases:
  - Deep Learning
  - глибинне навчання
  - DL
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: <p><b>Глибоке навчання (Deep Learning)</b> — підгалузь машинного навчання,
    що базується на використанні штучних нейронних мереж з багатьма прихованими шарами
    (звідси «глибоке»). Дозволяє моделям автоматично виділяти складні ієрархічні ознаки
    з сирих неструктурованих даних (зображення, аудіо, текст) без необхідності ручного
    конструювання ознак (feature engineering).</p>
- id: 71
  concept: Джон Маккарті
  aliases:
  - John McCarthy
  - Маккарті
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: <p><b>Джон Маккарті (John McCarthy, 1927–2011)</b> — видатний американський
    науковець у галузі комп'ютерних наук, один із «батьків-засновників» штучного інтелекту.
    Саме він увів у науковий обіг термін <i>«Artificial Intelligence»</i> під час
    організації легендарного Дартмутського семінару 1956 року. Також є автором мови
    програмування Lisp та концепції time-sharing (розподілу часу комп'ютерних ресурсів).</p>
- id: 44
  concept: Експертна система
  aliases:
  - Експертні системи
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p dir="ltr" style="text-align: left;">Це комп’ютерні програми, які
    імітують процес прийняття рішень експерта в певній галузі. Вони використовують
    базу знань і набір логічних правил для аналізу вхідних даних та надання рекомендацій
    або висновків.<br></p>'
- id: 72
  concept: Кімната Серла
  aliases:
  - Китайська кімната
  - Chinese Room
