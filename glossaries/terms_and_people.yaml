  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p><b>Проблема вагонетки (Trolley Problem)</b> — класичний мисленнєвий
    експеримент в етиці: чи морально перевести стрілку некерованої вагонетки, щоб
    вона вбила одну людину замість п''ятьох? У контексті штучного інтелекту ця проблема
    постає при програмуванні автономного транспорту (безпілотних авто) у критичних
    аварійних ситуаціях (дослідницький проєкт MIT «Моральна машина» / Moral Machine).</p>'
