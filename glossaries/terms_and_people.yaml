  definition: <p><b>Метрики якості в ML</b> — числові критерії оцінки ефективності
    алгоритмів:<ul><li><b>Accuracy (Точність)</b> — частка правильних прогнозів серед
    усіх зроблених.</li><li><b>Precision (Влучність)</b> — частка дійсно правильних
    позитивних відповідей серед усіх, які модель назвала позитивними.</li><li><b>Recall
    (Повнота)</b> — частка знайдених моделлю позитивних об'єктів серед усіх справді
    наявних.</li><li><b>F1-score</b> — гармонійне середнє між Precision та Recall,
    критичне для незбалансованих датасетів.</li></ul></p>
