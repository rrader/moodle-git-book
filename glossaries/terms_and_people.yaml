  definition: <p><b>Навчання з підкріпленням (Reinforcement Learning / RL)</b> — парадигма
    машинного навчання, за якої автономний агент вчиться приймати оптимальні рішення
    у взаємодії з навколишнім середовищем. Агент виконує дії та отримує зворотний
    зв'язок у вигляді числових винагород (rewards) або штрафів (penalties), маючи
    за мету максимізувати сумарну довгострокову винагороду. Використовується для навчання
    роботів, автопілотів та ігрових ШІ (наприклад, AlphaGo).</p>
