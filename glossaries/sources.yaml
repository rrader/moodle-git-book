  definition: '<p dir="ltr"><strong>Володимир Поліщук. «Елементарно, Ватсоне! Детектив-загадки»</strong>
    — збірка детективних історій, логічних головоломок та прикладних розслідувань
    за участі дільничного Петренка та сержанта Власюка (122 сторінки). Використовується
    як банк сюжетів для розробки баз знань, формулювання фактів і правил та створення
    експертних систем на Prolog: <a href="https://moodle.rmn.pp.ua/pluginfile.php/247/mod_book/chapter/122/vatson.pdf"
    target="_blank" rel="noopener noreferrer">Завантажити книгу (PDF, 2.7 MB) ↗</a></p>'
