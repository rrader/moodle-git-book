- id: 78
  concept: AI4K12
  aliases:
  - ai4k12
  - ai4k12.org
  - AI for K-12
  - ініціатива AI4K12
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p dir="ltr"><strong>AI4K12 (Artificial Intelligence for K-12)</strong>
    — спільна ініціатива Асоціації з розвитку штучного інтелекту (AAAI) та Асоціації
    вчителів інформатики (CSTA), яка розробляє національні освітні настанови та стандарти
    навчання ШІ для учнів початкової та середньої школи: <a href="https://ai4k12.org/"
    target="_blank" rel="noopener noreferrer">https://ai4k12.org/</a></p>'
- id: 79
  concept: AI4K12-Big-Ideas
  aliases:
  - big-ideas-poster
  - Пʼять великих ідей штучного інтелекту
  - 5 великих ідей
  - Five Big Ideas
  - постер 5 великих ідей
  usedynalink: 1
  casesensitive: 0
  fullmatch: 1
  definition: '<p dir="ltr"><strong>Пʼять великих ідей штучного інтелекту (AI4K12
    Five Big Ideas in AI)</strong> — ключові концептуальні напрями розуміння ШІ для
    шкільної освіти (Сприйняття, Представлення й міркування, Навчання, Взаємодія з
    людиною, Суспільний вплив). Український переклад постера: <a href="https://ai4k12.org/wp-content/uploads/AI4K12_Five_Big_Ideas_Poster_v2_Ukrainian.pdf"
    target="_blank" rel="noopener noreferrer">AI4K12 Five Big Ideas Poster (PDF)</a>.</p>'
